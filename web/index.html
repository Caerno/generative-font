<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Живой почерк → PDF</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400..700&family=Geist+Mono:wght@400;500&display=swap">
<style>
  /* Палитра и шрифты — как у прототипа главной caerno.github.io (тёмная тема). */
  :root { --bg: #121315; --bg2: #17181B; --ink: #E8E6E1; --mid: #B9B7B2; --dim: #7C7F85; --line: #26282C; --accent: #E0703A;
          --sans: 'Geist', system-ui, sans-serif; --mono: 'Geist Mono', monospace; color-scheme: dark; }
  body { margin: 0; font: 14px/1.4 var(--sans); display: flex; height: 100vh; background: var(--bg); color: var(--ink);
         -webkit-font-smoothing: antialiased; }
  aside { width: 320px; flex: none; padding: 16px; box-sizing: border-box; background: var(--bg2); border-right: 1px solid var(--line);
          overflow: auto; display: flex; flex-direction: column; gap: 10px; }
  textarea { width: 100%; height: 220px; box-sizing: border-box; font: 14px/1.4 var(--sans); resize: vertical;
             background: var(--bg); color: var(--ink); border: 1px solid var(--line); border-radius: 2px; padding: 10px; }
  label { display: flex; justify-content: space-between; align-items: center; gap: 8px; color: var(--mid); font-size: 13.5px; }
  input[type=range] { width: 130px; accent-color: var(--accent); }
  input[type=checkbox] { accent-color: var(--accent); }
  select, input[type=number] { background: var(--bg); color: var(--ink); border: 1px solid var(--line); border-radius: 2px;
                               padding: 5px 8px; font: 13px var(--sans); }
  select { flex: 1; min-width: 0; }
  input[type=color] { width: 44px; height: 26px; padding: 2px; background: var(--bg); border: 1px solid var(--line); border-radius: 2px; }
  textarea:focus, select:focus, input:focus { outline: none; border-color: var(--dim); }
  output { width: 34px; text-align: right; color: var(--dim); font: 11.5px var(--mono); }
  button { padding: 10px 14px; font: 500 14px var(--sans); cursor: pointer; border-radius: 2px;
           background: transparent; color: var(--ink); border: 1px solid var(--line); }
  button:hover { border-color: var(--dim); }
  #pdf { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  #pdf:hover { background: #fff; }
  #status { color: var(--dim); font: 11px/1.6 var(--mono); white-space: pre-line; }
  .lang { display: flex; justify-content: flex-end; gap: 4px; margin-bottom: -4px; }
  .lang button { padding: 2px 6px; font: 11px var(--mono); color: var(--dim); border: none; }
  .lang button:hover { color: var(--mid); }
  .lang button[aria-pressed=true] { color: var(--ink); }
  main { flex: 1; overflow: auto; padding: 24px; display: flex; flex-direction: column; align-items: center; gap: 24px; }
  svg.page { background: #fff; box-shadow: 0 1px 4px rgba(0,0,0,.25); width: min(100%, 794px); height: auto; flex: none; }
  .rise { opacity: 0; transform: translateY(22px); transition: opacity .7s cubic-bezier(.2,.7,.3,1), transform .7s cubic-bezier(.2,.7,.3,1); }
  .rise.in { opacity: 1; transform: none; }
</style>
</head>
<body>
<aside>
  <div class="lang rise"><button data-lang="ru">RU</button><button data-lang="en">EN</button></div>
  <textarea id="text" class="rise"></textarea>
  <label class="rise"><span data-t="font">Шрифт</span> <select id="font"></select></label>
  <label class="rise"><span data-t="size">Размер, pt</span> <input id="size" type="range" min="10" max="40" step="1" value="20"><output></output></label>
  <label class="rise"><span data-t="leading">Интервал</span> <input id="leading" type="range" min="1" max="2.2" step="0.05" value="1.4"><output></output></label>
  <label class="rise"><span data-t="mess">Небрежность</span> <input id="mess" type="range" min="0" max="1" step="0.05" value="0.5"><output></output></label>
  <label class="rise"><span data-t="alts">Формы букв из шрифта</span> <input id="alts" type="checkbox" checked></label>
  <label class="rise"><span data-t="ink">Чернила</span> <input id="ink" type="color" value="#1b2a6b"></label>
  <label class="rise"><span data-t="seed">Зерно</span> <input id="seed" type="number" value="1" style="width: 100px"></label>
  <button id="reseed" class="rise" data-t="reseed">Другой вариант</button>
  <button id="pdf" class="rise" data-t="pdf">Скачать PDF</button>
  <div id="status" class="rise"></div>
</aside>
<main id="pages" class="rise"></main>

<!-- Обычные скрипты, не модули: страница открывается через file://, там модули и fetch запрещены. -->
<script src="vendor/fontkit.umd.min.js"></script>
<script src="vendor/pdf-lib.min.js"></script>
<script src="fonts.js"></script>
<script>
'use strict';
const PAGE = { w: 595.28, h: 841.89, margin: 56 };  // A4 в пунктах
const $ = id => document.getElementById(id);

// --- шрифты -------------------------------------------------------------
function b64bytes(b64) {
  const s = atob(b64), u = new Uint8Array(s.length);
  for (let i = 0; i < s.length; i++) u[i] = s.charCodeAt(i);
  return u;
}
const loaded = {};
function getFont(key) {
  if (!loaded[key]) {
    const bytes = b64bytes(FONTS[key].b64);
    loaded[key] = { bytes, font: fontkit.create(bytes), variants: FONTS[key].variants, cmds: new Map() };
  }
  return loaded[key];
}
// Контур глифа в единицах шрифта; квадратичные кривые сразу переводим в кубические.
function glyphCommands(F, gid) {
  let out = F.cmds.get(gid);
  if (out) return out;
  out = [];
  let cx = 0, cy = 0;
  for (const { command, args: a } of F.font.getGlyph(gid).path.commands) {
    if (command === 'moveTo' || command === 'lineTo') { out.push([command === 'moveTo' ? 'M' : 'L', a[0], a[1]]); [cx, cy] = a; }
    else if (command === 'quadraticCurveTo') {
      const [qx, qy, x, y] = a;
      out.push(['C', cx + 2 / 3 * (qx - cx), cy + 2 / 3 * (qy - cy), x + 2 / 3 * (qx - x), y + 2 / 3 * (qy - y), x, y]);
      [cx, cy] = [x, y];
    }
    else if (command === 'bezierCurveTo') { out.push(['C', ...a]); [cx, cy] = [a[4], a[5]]; }
    else if (command === 'closePath') out.push(['Z']);
  }
  F.cmds.set(gid, out);
  return out;
}

// --- случайность ----------------------------------------------------------
// Одно зерно — одна и та же раскладка: что в превью, то и в PDF.
function mulberry32(a) {
  return () => {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

// --- вёрстка ---------------------------------------------------------------
function baseGid(F, ch) {
  const cp = ch.codePointAt(0);
  return F.font.hasGlyphForCodePoint(cp) ? F.font.glyphForCodePoint(cp).id : null;
}
function advance(F, gid) { return F.font.getGlyph(gid).advanceWidth; }

// Текст -> строки (перенос по словам, ширина по базовым глифам).
function wrap(text, F, o) {
  const k = o.size / F.font.unitsPerEm, maxW = PAGE.w - 2 * PAGE.margin;
  const width = s => [...s].reduce((w, ch) => { const g = baseGid(F, ch); return w + (g === null ? 0 : advance(F, g) * k); }, 0);
  const lines = [];
  for (const para of text.replace(/\t/g, '    ').split('\n')) {
    let line = '';
    for (const tok of para.split(/(\s+)/)) {
      if (!tok) continue;
      if (line && width(line + tok) > maxW) {
        lines.push(line.trimEnd());
        line = /^\s+$/.test(tok) ? '' : tok;
      } else line += tok;
      while (width(line) > maxW) {  // слово длиннее строки — режем по буквам
        let n = [...line].length - 1;
        while (n > 1 && width([...line].slice(0, n).join('')) > maxW) n--;
        lines.push([...line].slice(0, n).join(''));
        line = [...line].slice(n).join('');
      }
    }
    lines.push(line.trimEnd());
  }
  return lines;
}

const num = v => Math.round(v * 10) / 10;  // 0,1 pt = 0,035 мм: на печати не видно, PDF легче

// Строка -> контур (координаты страницы, ось y вниз) + сведения для текстового слоя.
function renderLine(text, F, o, rnd, x0, baseline, lastPick) {
  const upm = F.font.unitsPerEm, k = o.size / upm, m = o.mess, R = (a, b) => a + (b - a) * rnd();
  const slope = Math.tan(R(-0.6, 0.6) * m * Math.PI / 180);
  const waveA = R(0, 0.04) * m * o.size, waveF = 2 * Math.PI / R(150, 400), waveP = R(0, 6.28);
  let pen = x0 + R(-2, 2) * m;
  const parts = [];
  for (const ch of text) {
    let gid = baseGid(F, ch);
    if (gid === null) continue;
    const vars = o.alts && F.variants[ch];
    if (vars) {  // случайная форма, но не та же, что у прошлой такой же буквы
      let i = Math.floor(rnd() * vars.length);
      if (vars.length > 1 && i === lastPick[ch]) i = (i + 1 + Math.floor(rnd() * (vars.length - 1))) % vars.length;
      lastPick[ch] = i; gid = vars[i];
    }
    const adv = advance(F, gid);
    if (/\s/.test(ch)) { pen += adv * k * (1 + R(-0.15, 0.25) * m); continue; }
    const rot = R(-3, 3) * m * Math.PI / 180, cos = Math.cos(rot), sin = Math.sin(rot);
    const sc = 1 + R(-0.05, 0.05) * m, sy = 1 + R(-0.04, 0.04) * m;
    const A = 0.035 * upm * m, fx = 2 * Math.PI / (R(0.5, 1.1) * upm), fy = 2 * Math.PI / (R(0.5, 1.1) * upm);
    const p1 = R(0, 6.28), p2 = R(0, 6.28), cx = adv / 2, cy = 0.35 * upm;
    const by = baseline + (pen - x0) * slope + waveA * Math.sin((pen - x0) * waveF + waveP) + R(-0.04, 0.04) * m * o.size;
    const px = pen;
    const tf = (x, y) => {  // плавное искажение контура + масштаб и поворот вокруг центра буквы
      const wx = x + A * Math.sin(y * fy + p1), wy = y + A * Math.sin(x * fx + p2);
      const X = (wx - cx) * sc, Y = (wy - cy) * sc * sy;
      return num(px + (X * cos - Y * sin + cx) * k) + ' ' + num(by - (X * sin + Y * cos + cy) * k);
    };
    let d = '';
    for (const c of glyphCommands(F, gid)) {
      if (c[0] === 'Z') d += 'Z';
      else if (c[0] === 'C') d += 'C' + tf(c[1], c[2]) + ' ' + tf(c[3], c[4]) + ' ' + tf(c[5], c[6]);
      else d += c[0] + tf(c[1], c[2]);
    }
    parts.push(d);
    pen += adv * k * (1 + R(-0.03, 0.05) * m);
  }
  return { d: parts.join(''), text, x0, baseline };
}

function render(o) {
  const F = getFont(o.font), rnd = mulberry32(o.seed), lastPick = {};
  const lineH = o.size * o.leading;
  const perPage = Math.max(1, Math.floor((PAGE.h - 2 * PAGE.margin - o.size) / lineH) + 1);
  const lines = wrap(o.text, F, o), pages = [];
  lines.forEach((t, i) => {
    if (i % perPage === 0) pages.push({ lines: [] });
    const baseline = PAGE.margin + o.size + (i % perPage) * lineH;
    pages[pages.length - 1].lines.push(renderLine(t, F, o, rnd, PAGE.margin, baseline, lastPick));
  });
  return { pages, F, o };
}

// --- язык интерфейса ---------------------------------------------------------
const pluralRu = (n, one, few, many) =>
  n % 10 === 1 && n % 100 !== 11 ? one : n % 10 >= 2 && n % 10 <= 4 && (n % 100 < 12 || n % 100 > 14) ? few : many;
const I18N = {
  ru: {
    title: 'Живой почерк → PDF', font: 'Шрифт', size: 'Размер, pt', leading: 'Интервал', mess: 'Небрежность',
    alts: 'Формы букв из шрифта', ink: 'Чернила', seed: 'Зерно', reseed: 'Другой вариант', pdf: 'Скачать PDF',
    forms: n => `${n} ${pluralRu(n, 'форма', 'формы', 'форм')}`,
    stats: (pages, outlines, ms) => `Страниц: ${pages}; контуров: ${outlines}; ${ms} мс`,
    fontLine: 'Шрифт', pdfSize: kb => `PDF: ${kb} КБ`, pdfError: 'Ошибка PDF', creator: 'Живой почерк', file: 'pocherk.pdf',
    sample: 'Бабушка испекла блины. Блины были большие, белые и блестящие; бабушка ставила блины на стол, а мы брали блины руками.\n\n' +
      'Съешь же ещё этих мягких французских булок, да выпей чаю.',
  },
  en: {
    title: 'Living handwriting → PDF', font: 'Font', size: 'Size, pt', leading: 'Line spacing', mess: 'Messiness',
    alts: 'Letter forms from the font', ink: 'Ink', seed: 'Seed', reseed: 'Another variant', pdf: 'Download PDF',
    forms: n => `${n} ${n === 1 ? 'form' : 'forms'}`,
    stats: (pages, outlines, ms) => `Pages: ${pages}; outlines: ${outlines}; ${ms} ms`,
    fontLine: 'Font', pdfSize: kb => `PDF: ${kb} KB`, pdfError: 'PDF error', creator: 'Living handwriting', file: 'handwriting.pdf',
    sample: 'Grandma baked pancakes. The pancakes were big, pale and glossy; grandma kept putting pancakes on the table, and we took the pancakes by hand.\n\n' +
      'The quick brown fox jumps over the lazy dog.',
  },
};
function initialLang() {
  const q = new URLSearchParams(location.search).get('lang');
  if (I18N[q]) return q;
  try { const saved = localStorage.getItem('lang'); if (I18N[saved]) return saved; } catch (e) {}
  return (navigator.languages || [navigator.language]).some(l => /^ru\b/i.test(l)) ? 'ru' : 'en';
}
// Сколько форм у буквы чаще всего — для подписи в списке шрифтов.
function formsCount(f) {
  const n = {};
  for (const ids of Object.values(f.variants)) n[ids.length] = (n[ids.length] || 0) + 1;
  return +Object.keys(n).sort((a, b) => n[b] - n[a])[0] || 1;
}
let T = null;
function setLang(lang, remember) {
  T = I18N[lang];
  document.documentElement.lang = lang;
  document.title = T.title;
  document.querySelectorAll('[data-t]').forEach(el => el.textContent = T[el.dataset.t]);
  document.querySelectorAll('[data-lang]').forEach(b => b.setAttribute('aria-pressed', b.dataset.lang === lang));
  for (const opt of $('font').options) opt.text = `${FONTS[opt.value].title} — ${T.forms(formsCount(FONTS[opt.value]))}`;
  const text = $('text').value;  // свой текст не трогаем, меняем только пустой или пример
  if (!text.trim() || Object.values(I18N).some(t => t.sample === text)) $('text').value = T.sample;
  if (remember) {
    try { localStorage.setItem('lang', lang); } catch (e) {}
    try {
      const url = new URL(location.href);
      if (url.searchParams.has('lang')) { url.searchParams.set('lang', lang); history.replaceState(null, '', url); }
    } catch (e) {}
  }
  refresh();
}

// --- интерфейс --------------------------------------------------------------
for (const [key, f] of Object.entries(FONTS)) $('font').add(new Option(f.title, key));
const opts = () => ({
  text: $('text').value, font: $('font').value, size: +$('size').value, leading: +$('leading').value,
  mess: +$('mess').value, alts: $('alts').checked, ink: $('ink').value, seed: +$('seed').value | 0,
});
let current = null, timer = null;
function refresh() {
  document.querySelectorAll('input[type=range]').forEach(r => r.nextElementSibling.value = r.value);
  const t0 = performance.now();
  current = render(opts());
  const ink = current.o.ink;
  $('pages').innerHTML = current.pages.map(p =>
    `<svg class="page" viewBox="0 0 ${PAGE.w} ${PAGE.h}" xmlns="http://www.w3.org/2000/svg">` +
    p.lines.map(l => l.d ? `<path d="${l.d}" fill="${ink}"/>` : '').join('') + '</svg>').join('');
  const glyphs = current.pages.reduce((n, p) => n + p.lines.reduce((m, l) => m + (l.d.match(/M/g) || []).length, 0), 0);
  const F = FONTS[current.o.font];
  $('status').textContent = T.stats(current.pages.length, glyphs, Math.round(performance.now() - t0)) + '\n' +
    `${T.fontLine}: ${F.title}, ${T.forms(formsCount(F))}; ${F.license}`;
}
const later = () => { clearTimeout(timer); timer = setTimeout(refresh, 120); };
document.querySelectorAll('aside input, aside select, aside textarea').forEach(el => el.addEventListener('input', later));
$('reseed').onclick = () => { $('seed').value = Math.floor(Math.random() * 1e9); refresh(); };

// PDF: буквы — векторные контуры; поверх каждой строки невидимый текст, чтобы PDF искался и копировался.
async function exportPdf() {
  const { PDFDocument, rgb } = PDFLib;
  const { pages, F, o } = current;
  const doc = await PDFDocument.create();
  doc.registerFontkit(fontkit);
  const textFont = await doc.embedFont(F.bytes, { subset: true });
  const hex = o.ink.slice(1).match(/../g).map(h => parseInt(h, 16) / 255);
  for (const p of pages) {
    const page = doc.addPage([PAGE.w, PAGE.h]);
    for (const l of p.lines) {
      if (l.d) page.drawSvgPath(l.d, { x: 0, y: PAGE.h, color: rgb(...hex) });
      const text = [...l.text].filter(ch => baseGid(F, ch) !== null).join('');
      if (text.trim()) page.drawText(text, { x: l.x0, y: PAGE.h - l.baseline, size: o.size, font: textFont, opacity: 0 });
    }
  }
  doc.setTitle(o.text.trim().split('\n')[0].slice(0, 80));
  doc.setCreator(T.creator);
  const bytes = await doc.save();
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([bytes], { type: 'application/pdf' }));
  a.download = T.file;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 10000);
  $('status').textContent += '\n' + T.pdfSize(Math.round(bytes.length / 1024));
}
$('pdf').onclick = () => exportPdf().catch(e => { $('status').textContent += `\n${T.pdfError}: ${e.message}`; console.error(e); });
document.querySelectorAll('[data-lang]').forEach(b => b.onclick = () => setLang(b.dataset.lang, true));

setLang(initialLang());

// Плавное появление блоков — тот же приём, что .rise на главной: класс in, когда блок доехал до экрана.
document.querySelectorAll('aside .rise').forEach((el, i) => el.style.transitionDelay = `${i * 40}ms`);
const io = new IntersectionObserver(es => es.forEach(en => {
  if (en.isIntersecting) { en.target.classList.add('in'); io.unobserve(en.target); }
}), { threshold: 0.15 });
document.querySelectorAll('.rise').forEach(el => io.observe(el));
</script>
</body>
</html>
